<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Percy Quin 360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/pannellum.css">
  <link rel="stylesheet" href="walkthrough.css?v=20261105-trail2">
</head>
<body>
  <main id="panorama" aria-label="360 degree trail panorama"></main>

  <header class="brand">
    <div class="brand-row">
      <img src="4D_logo.jpg" alt="4D Surveying" class="brand-logo">
      <div class="brand-headings">
        <span class="eyebrow">EXPLORE AT YOUR OWN PACE</span>
        <h1>Percy Quin</h1>
      </div>
    </div>
  </header>

  <nav class="tools" aria-label="Viewer tools">
    <button id="home" title="Return to start" aria-label="Return to the start">⌂</button>
    <button id="share" title="Share this view" aria-label="Share this view">↗</button>
    <button id="fullscreen" title="Full screen" aria-label="Full screen">⛶</button>
    <button id="options" title="Information and settings" aria-label="Information and settings" aria-expanded="false" aria-controls="settings">i</button>
  </nav>

  <aside id="settings" hidden aria-label="Information and settings">
    <div class="panel-title">
      <h2>Settings</h2>
      <button id="close-settings" aria-label="Close settings">×</button>
    </div>
    <p class="settings-hint">Drag to look around. Forward follows the direction you face; Back returns to your previous view. Use W/S or the ground arrows to walk.</p>
    <label id="photo-group" hidden>More views here<select id="photo-select"></select></label>
    <label>Detail
      <select id="quality">
        <option value="2048" selected>Fast (2K HD)</option>
        <option value="4096">Ultra HD (4K)</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="survey"> Show surveyed trail</label>
    <button id="overview">Show full trail</button>
    <label id="share-fallback" hidden>Share view link<input id="share-url" readonly></label>
  </aside>

  <section id="map-panel" aria-label="Trail map">
    <div class="map-heading">
      <span id="map-label">TRAIL MAP</span>
      <div>
        <button id="expand-map" aria-label="Expand map" aria-expanded="false">⤢</button>
        <button id="toggle-map" aria-label="Hide map" aria-expanded="true">−</button>
      </div>
    </div>
    <div id="map"></div>
  </section>

  <div class="walk-controls" aria-label="Walk along the trail">
    <button id="back" aria-label="Return to previous view">← <span>Back</span></button>
    <button id="turn-around" aria-label="Turn around" title="Turn around">↶ <span>Turn around</span></button>
    <span class="walk-divider"></span>
    <button id="forward" aria-label="Walk forward"><span>Forward</span> →</button>
  </div>

  <p id="hint">Drag to look around · Follow the arrows to walk</p>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <div id="walk-choices" aria-label="Choose a walking direction" hidden></div>
  <button id="retry" hidden>Try again</button>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/pannellum.js"></script>
  <script type="module" src="walkthrough.js?v=20261105-mapcenter"></script>
</body>
</html>
